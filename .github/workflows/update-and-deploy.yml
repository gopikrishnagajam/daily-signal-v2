name: Refresh feed and deploy Daily Signal

on:
  push:
    branches: [main]
  schedule:
    # 8:17 AM and 8:17 PM Central Time. GitHub may delay scheduled jobs.
    - cron: '17 8,20 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-signal-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check feed updater against fixtures
        run: python -m unittest discover -s tests -v

      - name: Refresh news feed
        run: python scripts/refresh_feed.py

      - name: Commit refreshed feed snapshot
        run: |
          git config user.name "daily-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish updated Daily Signal feed"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No feed changes"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the assembled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
